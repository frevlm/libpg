name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # libpq 16: the pre-17 engine path. The server is PostgreSQL 18 in a
          # container: the query-file fixtures use RETURNING old/new.
          - name: ubuntu-gcc-libpq16
            os: ubuntu-24.04
            test_server: postgresql://postgres@127.0.0.1:5432
          # libpq 18: the 17+ engine path, on a local cluster
          - name: macos-clang-pg18
            os: macos-26
            pg_ctl: /opt/homebrew/opt/postgresql@18/bin/pg_ctl
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libpq-dev postgresql-client catch2
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:18
          until pg_isready -q -h 127.0.0.1 -p 5432; do sleep 1; done

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja libpq postgresql@18 catch2

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIBPG_BENCH=ON
          -DLIBPG_PG_CTL=${{ matrix.pg_ctl }} -DLIBPG_TEST_SERVER=${{ matrix.test_server }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build as a subproject
        run: |
          cmake -S tests/consumer -B build-consumer -G Ninja -DLIBPG_SOURCE_DIR=$PWD
          cmake --build build-consumer
